# KerjaYuk backend — konfigurasi aislop
version: 1

engines:
  format: true
  lint: true
  code-quality: true
  ai-slop: true
  architecture: false
  security: true

quality:
  knip: off # knip gagal berjalan di proyek CommonJS ini (parser oxc error); audit kode mati tetap ditutup oxlint/code-quality

scoring:
  weights:
    format: 0.3
    lint: 0.6
    code-quality: 0.8
    ai-slop: 1.0
    architecture: 1.0
    security: 1.5
  thresholds:
    good: 75
    ok: 50
  smoothing: 20
  maxPerRule: 40

ci:
  failBelow: 75
  format: json
