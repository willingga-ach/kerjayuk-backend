# Manifest deploy Koyeb — backend KerjaYuk
# Dipakai: koyeb app deploy ... (atau taruh di dashboard → "Create Service from manifest")
# 🔁 Ganti <GITHUB_USERNAME> dengan username GitHub kamu.

app:
  name: kerjayuk-backend

service:
  name: api
  definition:
    repos:
      - type: github
        repository: <GITHUB_USERNAME>/kerjayuk-backend
        branch: main
      # Jika tidak connect GitHub, impor image hasil build:
      # - type: docker
      #   repository: registry.koyeb.com/<ganti>/kerjayuk-backend
    instance_type: nano
    scalings:
      min: 1
      max: 1
    ports:
      - port: 3000
        protocol: http
    health_checks:
      - port: 3000
        path: /api/health
        interval: 30
        timeout: 5
    # Environment — diisi di dashboard Koyeb (jangan commit .env!)
    env:
      - key: PORT
        value: "3000"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: "postgresql://GANTI:PASSWORD@db.GANTI.supabase.co:5432/postgres"
      - key: DIRECT_URL
        value: "postgresql://GANTI:PASSWORD@db.GANTI.supabase.co:5432/postgres"
      - key: JWT_SECRET
        value: "GANTI-DENGAN-SECRET-KUAT"
      - key: JWT_EXPIRES_IN
        value: "1d"
      - key: FRONTEND_URL
        value: "https://kerjayuk-frontend.vercel.app"

# Build (Buildpack Node) — default Koyeb; tidak perlu Dockerfile
# build:
#   builder: buildpack
#   run_command: node src/server.js
#   build_command: npm ci && npx prisma generate
